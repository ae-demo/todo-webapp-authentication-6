openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: Manages a signed-in user's own to-do items.
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            todos:read: See the caller's to-do items
            todos:submit: Create a to-do item
            todos:manage: Edit or delete the caller's to-do items
  schemas:
    TodoItem:
      type: object
      required: [id, title, completed, createdAt]
      properties:
        id: { type: string, description: item id }
        title: { type: string, description: item title }
        completed: { type: boolean, description: completion status }
        createdAt: { type: string, format: date-time, description: creation timestamp }
        updatedAt: { type: string, format: date-time, description: last update timestamp }
    TodoItemCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, description: item title }
    TodoItemUpdate:
      type: object
      properties:
        title: { type: string, description: new title }
        completed: { type: boolean, description: new completion status }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
security:
  - oauth2: []
paths:
  /me/todos:
    get:
      operationId: listMyTodos
      summary: The caller's to-do items
      security:
        - oauth2: [todos:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: completed
          in: query
          schema: { type: boolean }
          description: filter by completion status
      responses:
        '200':
          description: A page of the caller's to-do items
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TodoItem' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createMyTodo
      summary: Create a to-do item for the caller
      security:
        - oauth2: [todos:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoItemCreate' }
      responses:
        '201':
          description: The created to-do item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoItem' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/todos/{todoId}:
    parameters:
      - name: todoId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateMyTodo
      summary: Edit or complete/reopen the caller's to-do item
      security:
        - oauth2: [todos:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoItemUpdate' }
      responses:
        '200':
          description: The updated to-do item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoItem' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such to-do item for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteMyTodo
      summary: Delete the caller's to-do item
      security:
        - oauth2: [todos:manage]
      responses:
        '204':
          description: Deleted
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such to-do item for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
